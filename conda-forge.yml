bot:
  abi_migration_branches:
  - 21.x
  - 20.x
  - 19.x
build_platform:
  linux_ppc64le: linux_64
  linux_riscv64: linux_64
conda_build:
  error_overlinking: true
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
  win_arm64: default
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
  - os: win
    value: C:\bld
  tools_install_dir:
  - os: win
    value: C:\Miniforge
